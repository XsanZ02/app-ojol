quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:rideflow}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rideflow}

quarkus.hibernate-orm.schema-management.strategy=none

quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=db/migration
quarkus.flyway.clean-at-start=false
quarkus.flyway.clean-disabled=true
rideflow.driver-verification.v4-enabled=${DRIVER_VERIFICATION_V4_ENABLED:true}
rideflow.documents.storage-path=${DRIVER_DOCUMENT_STORAGE_PATH:./data/driver-documents}
rideflow.routing.valhalla-url=${VALHALLA_ROUTING_URL:https://valhalla1.openstreetmap.de/route}
rideflow.routing.timeout-seconds=${ROUTING_TIMEOUT_SECONDS:8}
rideflow.fare.motor.base-fare=${FARE_MOTOR_BASE_FARE:5000}
rideflow.fare.motor.per-kilometer=${FARE_MOTOR_PER_KILOMETER:2000}
rideflow.fare.motor.minimum-fare=${FARE_MOTOR_MINIMUM_FARE:8000}
rideflow.fare.car.base-fare=${FARE_CAR_BASE_FARE:8000}
rideflow.fare.car.per-kilometer=${FARE_CAR_PER_KILOMETER:3500}
rideflow.fare.car.minimum-fare=${FARE_CAR_MINIMUM_FARE:12000}
rideflow.fare.currency=${FARE_CURRENCY:IDR}
rideflow.fare.config-version=${FARE_CONFIG_VERSION:demo-v2-vehicle}

mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
mp.jwt.verify.issuer=${JWT_ISSUER:rideflow}
mp.jwt.verify.audiences=${JWT_AUDIENCE:rideflow-api}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
rideflow.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${RIDEFLOW_FRONTEND_ORIGIN:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type
quarkus.http.cors.access-control-allow-credentials=false